# MiraeAsset CLOVA AI Challenge - Docker Compose
version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=0
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=122miraeasset
      # 실제 API 키들
      - NAVER_CLOVA_API_KEY=nv-8713f1b618e04e5095b402f2027c9affXOI2
      - NAVER_CLOVA_API_HOST=clovastudio.stream.ntruss.com
      - NAVER_CLOVA_MODEL=HCX-003
      - USE_HYPERCLOVA=true
      - GOOGLE_SERPER_API_KEY=962b2457d60f0c08fdb8fa26f84291cdc2af27af
      - HEYGEN_API_KEY=YTMzZDhmOWNiZTA3NGMwMDhlOWZhYmUwZmQxNTY4MDctMTc1Mzg1NjkzOA==
      - DART_API_KEY=db3b106cf3886f70ea0aa011165dfbab29bf7396
    volumes:
      - ./backend:/app  # 전체 백엔드 코드 마운트 (핫 리로드용)
      - ./backend/data:/app/data
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]  # 핫 리로드 활성화
    depends_on:
      - elasticsearch
      - neo4j
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile.dev  # 개발용 Dockerfile 사용
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://3.37.16.208:8000
      - CHOKIDAR_USEPOLLING=true  # 파일 변경 감지 개선
      - FAST_REFRESH=true  # React Fast Refresh 활성화
    volumes:
      - ./Frontend/src:/app/src  # 소스 코드 마운트 (핫 리로드용)
      - ./Frontend/public:/app/public
      - /app/node_modules  # node_modules 제외
    depends_on:
      - backend
    restart: unless-stopped

  # Elasticsearch 클러스터
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: elasticsearch
    environment:
      - node.name=elasticsearch
      - cluster.name=es-docker-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"  # AWS용으로 메모리 줄임
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Neo4j 데이터베이스
  neo4j:
    image: neo4j:5.19.0-community
    container_name: neo4j
    environment:
      - NEO4J_AUTH=neo4j/122miraeasset
    volumes:
      - neo4j-data:/data
    ports:
      - "7474:7474"
      - "7687:7687"
    restart: unless-stopped

volumes:
  elasticsearch-data:
  neo4j-data:
